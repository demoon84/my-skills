name: Validate Skills Repo

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill metadata and catalog
        run: python3 scripts/skill_repo.py validate

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
