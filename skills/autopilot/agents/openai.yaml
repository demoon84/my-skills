interface:
  display_name: "autopilot"
  short_description: "Plan a task into plan.md, use 1/2/3/4 choice prompts for selection questions, then rely on the Stop hook until every checkbox is ticked."
  default_prompt: "Use $autopilot in Codex to talk through the task into plan.md (goal, scope, done-when, detailed todos). For every selection-type question, always ask with exactly `1.`, `2.`, `3.`, `4. 기타`, and if the user picks `4`, immediately ask for a short free-form reply. When execution starts, a Stop hook checks plan.md each time the agent tries to stop and forces it to continue as long as unchecked items remain. Prevent premature stops without using Codex automations or external schedulers."
