interface:
  display_name: "autopilot"
  short_description: "Plan a task into `.autopilot/<slug>_<timestamp>/plan.md`, use 1/2/3/4 choice prompts for selection questions, then combine the Stop hook with one Codex thread heartbeat backup until every checkbox is ticked."
  default_prompt: "Use $autopilot in Codex to talk through the task into `.autopilot/<slug>_<timestamp>/plan.md` (goal, scope, done-when, detailed todos). At the start of a fresh run, bootstrap that workspace with the init-run helper so the current thread gets a thread-scoped pointer under `.autopilot/threads/<thread-key>.current`, while `.autopilot/current` stays available only as a fallback. For every selection-type question, always ask with exactly `1.`, `2.`, `3.`, `4. 기타`, and if the user picks `4`, immediately ask for a short free-form reply. When you show a plan or choice list, make that block the last visible content of the turn so the user can read it before Codex collapses the reply. After saving an approved plan, stop with a short confirmation and wait for a separate explicit `진행`/`continue` message before starting execution. When execution starts, create or update one ACTIVE heartbeat automation on the current thread as a backup wake-up path (not cron; prefer a short interval such as every 10 minutes), then let the Stop hook remain the primary loop. The heartbeat prompt should reopen this same thread, resolve `AUTOPILOT_PLAN_PATH` first when explicitly set, otherwise the thread-scoped pointer under `.autopilot/threads/`, then `.autopilot/current`, continue only if unchecked items remain and `BLOCKER: true` is absent, and delete or pause itself when the run completes, pauses, or blocks. Prevent premature stops by combining the Stop hook with that single thread heartbeat, never by creating duplicate automations or external schedulers."
